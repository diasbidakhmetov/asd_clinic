{% extends "users/base.html" %}
{% load static %}


{% block head %} 
    <link rel="stylesheet" href="{% static 'css/login.css'%}">
{% endblock %}

{% block content %}
<main class="login-container">
    <div class="form-wrapper">
        <h2 class="form-title">Кіру</h2>
        <form action="{% url 'users:login' %}" method="POST" autocomplete="off">
            {% csrf_token %}
            <div class="form-group">    
                {{ form.username }}
            </div>
            <div class="form-group">
                {{ form.password }}
            </div>

            <button type="submit" name="action" value="enterBD" class="submit-btn">Кіру</button>

            <div class="form-links">
                <a href="{% url 'index' %}">Басты бет</a> |
                <a href="{% url 'users:register' %}">Тіркелу</a>
            </div>
        </form>
    </div>
</main>
{% endblock %}
