{% load static%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Tracking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/eye.css'%}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.9.0/localforage.min.js"></script>
    <script src="{% static 'js/WebGazer-master/www/webgazer.js' %}"></script>
    <script src="{% static 'js/webgazer_script.js'%}"></script>
</head>
<body>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            function resizeImage() {
                const img = document.getElementById("imageDisplay");
                if (img) {
                    img.style.width = `${window.innerWidth}px`;
                    img.style.height = `${window.innerHeight}px`;
                }
            }

            window.addEventListener("resize", resizeImage);
            resizeImage();

            document.getElementById("startTest").addEventListener("click", function () {
                const img = document.getElementById("imageDisplay");
                img.style.display = "block";
            });
        });
    </script>

    <div class = "test-guide-container" id = "test-guide-container">
        <div class = "warn">
            <h3>Ескерту</h3>
            <p>Тест нәтижелері маманның түсіндіруін қажет етеді.</p>
            <p>Өздігінен диагноз қою үшін Онлайн тестті қолдану мүмкін емес!</p>
            <p>Кез келген күмән туындаған жағдайда білікті мамандарға хабарласыңыз.</p>
        </div>
        <div class = "test_guide">
            <h3>Нұсқаулық</h3>
            {% for g in guide%}
            <p>{{g.name}}</p>
            {% endfor %}
        </div>
            <button id ="startTest"> Бастау </a></button>
        </div>
    </div>
    <img id="imageDisplay" src="">
    <audio id="audioPlayer" name="media" autoplay preload="auto"></audio>

    <script>
        function loadWebGazerModel() {
            fetch('/load_model/')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Нет сохраненной модели");
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.model) {
                        localforage.setItem("webgazerGlobalData", data.model.data);
                        localforage.setItem("webgazerGlobalSettings", data.model.settings);
                        console.log("Модель загружена!");
                    }
                })
                .catch(error => console.error("Ошибка загрузки модели:", error));
        }
    </script>
</body>
</html>
