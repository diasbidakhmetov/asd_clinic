{% extends 'core/base.html' %}

{% load static%}

{% block title %}
   {{ title}}
{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{% static 'css/cars.css'%}">
{% endblock %}

{% block content %}
    <div class="cars-test-container">
        <div class="progress-container">
            <progress id="progress-bar" value="0" max="15"></progress>
            <span id="progress-text">0 / 15</span>
        </div>
        <div class="question-container" id ='question'>
            
        </div>
        <div class="answer-container" id ='answer'></div>
    </div>

<script>
    const questions = JSON.parse('{{ question|escapejs }}');
    const answers = JSON.parse('{{ answer|escapejs }}').answers;
    let currentQuestionIndex = 0;
    let totalScore = 0;
    let userAnswers = [];

    const questionEl = document.getElementById('question');
    const answerEl = document.getElementById('answer');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    function showQuestion(index) {
        questionEl.textContent = questions[index];
        updateProgress();
    }

    function showAnswer(index) {
        answerEl.innerHTML = "";
        if (index < answers.length) {
            answers[index].forEach((answer, i) => {
                createAnswerButton(answer.name, answer.score);
                if (i < answers[index].length - 1) {
                    let nextScore = answers[index][i + 1].score;
                    let midScore = (answer.score + nextScore) / 2;
                    createAnswerButton(`${midScore}`, midScore);
                }
            });
        }
    }

    function createAnswerButton(text, score) {
        let btn = document.createElement("button");
        btn.textContent = `${text}`;
        btn.onclick = function() {
            totalScore += score;
            userAnswers.push({ question: questions[currentQuestionIndex], answer: text, score: score });
            nextQuestion();
        };
        answerEl.appendChild(btn);
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion(currentQuestionIndex);
            showAnswer(currentQuestionIndex);
        } else {
            sendResultsToServer();
        }
    }

    function updateProgress() {
        progressBar.value = currentQuestionIndex+1;
        progressText.textContent = `${currentQuestionIndex+1} / ${questions.length}`;
    }

    function getDiagnosis() {
        if (totalScore < 30) {
            return '1';
        } else if (totalScore < 36) {
            return "2";
        } else {
            return "3";
        }
    }

    function sendResultsToServer() {
        let resultData = {
            answers: userAnswers,
            totalScore: totalScore,
            diagnosis: getDiagnosis()
        };

        fetch("{% url 'autizm_tests:save_cars_results' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCSRFToken()
            },
            body: JSON.stringify(resultData)
        })
        .then(response => response.json())
        .then(data => {
            console.log("Результаты сохранены:", data);
            if (data.redirect_url) {
                window.location.href = data.redirect_url;
            }
        })

        .catch(error => console.error("Ошибка отправки данных:", error));
    }

    function getCSRFToken() {
        return document.cookie.split('; ')
            .find(row => row.startsWith('csrftoken='))
            ?.split('=')[1];
    }

    showQuestion(currentQuestionIndex);
    showAnswer(currentQuestionIndex);
</script>


{% endblock %}
